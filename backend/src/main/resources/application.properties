spring.application.name=backend
spring.config.import=optional:file:../.env[.properties]

# Default to 8080 locally, injected otherwise
server.port=${PORT:8080}

server.servlet.session.cookie.same-site=lax

# Behind Cloud Run's HTTPS front end, so the OAuth redirect URI comes out as https://<public host>
server.forward-headers-strategy=framework

spring.mvc.problemdetails.enabled=true

# Request ID from RequestIdFilter. Keep the escaped trailing space.
logging.pattern.correlation=[%X{requestId:-}]\ 

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# Gmail labels is requested separately, see SecurityConfiguration
spring.security.oauth2.client.registration.google.scope=openid,profile,email
