spring.application.name=backend
spring.config.import=optional:file:../.env[.properties]

# Default to 8080 locally, injected otherwise
server.port=${PORT:8080}

server.servlet.session.cookie.same-site=lax

spring.mvc.problemdetails.enabled=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/gmail.labels

# Where the browser lands after Google login
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Allowed browser origins:
# 3000 = react-router-serve / docker compose
# 5173 = `npm run dev`
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
